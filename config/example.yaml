# Example config with illustrative values only. Copy it to config/local.yaml (gitignored)
# and set your own values there. Nothing in this file is a recommendation.

mode: dry_run            # dry_run | live (live only after a clean dry run and an explicit go-ahead)

venues:
  variational:
    enabled: true
    adapter: variational
    execution: manual      # api | manual (ADR-0001): no trading API, the operator places orders
    max_leverage: "5"      # engine-side cap; must be <= what the venue allows
    fees:
      taker: "0"           # fraction of notional per fill (0.0005 = 5 bps)
    reward:                # linear objective per venue, in its own units (scorer numerator)
      per_usd_volume: "1"  # per USD traded, open + close
      per_usd_hour: "0"    # per USD of notional held per hour
  qfex:
    enabled: true
    adapter: qfex
    execution: api
    max_leverage: "5"
    fees:
      taker: "0.0005"
      by_instrument: {}    # canonical symbol -> taker fee, where it differs
    reward:
      per_usd_volume: "1"
      instrument_multiplier: {}  # canonical symbol -> multiplier (default 1)

# canonical symbol -> {venue: venue-native symbol}. When a venue's contract is a fraction of the
# instrument (its price is a tenth of the others'), give its contract_size instead:
#   US500-USD:
#     venue_a: {symbol: US500-PERP, contract_size: "0.1"}
#     venue_b: US500-USD
# Optional lot_size (order size step) and min_size, in venue units: the executor rounds both
# legs down to one size every venue accepts, and refuses a notional below a minimum:
#     venue_b: {symbol: US500-USD, lot_size: "0.001", min_size: "0.001"}
instruments:
  XAU-USD:
    variational: XAU-PERP
    qfex: GOLD-USD

risk:
  leverage_per_leg: "2"
  min_free_margin: "0.40"              # keep at least this fraction of free margin per venue
  rebalance_below_free_margin: "0.25"  # rebalance when a venue drops below this
  max_unhedged_seconds: 60
  max_price_divergence: "0.01"         # alert when venues' mids differ by more than 1%
  min_hold_minutes: 30
  max_hold_minutes: 120
  weekend:
    action: close                      # close | reduce_half | none
    before_us_close_minutes: 30

sizing:
  notional_per_leg_usd: "100"

# The model per role is chosen in docs/model-research.md, never hardcoded.
llm:
  supervisor:
    provider: TBD
    model: TBD

alerts:
  telegram_enabled: true

collector:
  interval_seconds: 30     # one snapshot of every configured pair on every venue
  db_path: data/market.db  # SQLite; data/ is gitignored

scoring:
  hold_minutes: 60         # the hold each candidate is costed at; within risk min/max_hold_minutes

executor:
  db_path: data/engine.db  # cycle state (SQLite); survives restarts mid-cycle
